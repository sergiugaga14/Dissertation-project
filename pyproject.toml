[project]
name = "dissertation-project"
version = "0.1.0"
description = "Retrieval-Augmented Generation dissertation project"
readme = "README.md"
authors = [
    { name = "Sergiu Gaga", email = "Sergiu.Gaga@broadridge.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
required-version = ">=0.12.3"
# Picks CUDA wheels on machines with an NVIDIA driver, CPU wheels elsewhere.
torch-backend = "auto"

[project.scripts]
dissertation-project = "dissertation_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
